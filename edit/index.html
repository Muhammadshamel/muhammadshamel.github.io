<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit portfolio | Muhammad Shamel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fb;--surface:#fff;--surface-2:#f0f3f7;--text:#101828;--muted:#5f6b7a;--line:#e4e8ee;--brand:#c73763;--brand-2:#7f2d58;--dark:#172033;--shadow:0 24px 60px rgba(16,24,40,.09);--radius:22px;--max:1200px;--font:"DM Sans",sans-serif;--display:"Manrope",sans-serif}
html[data-theme="dark"]{--bg:#0d1119;--surface:#141a24;--surface-2:#1a2230;--text:#f5f7fb;--muted:#a7b0bf;--line:#283243;--dark:#f5f7fb;--shadow:0 24px 70px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:82px}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}img{max-width:100%;display:block}.wrap{max-width:var(--max);margin:auto;padding:0 28px}.section{padding:110px 0}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--brand);margin-bottom:16px}.section h2{font-family:var(--display);font-size:clamp(38px,5vw,64px);line-height:1.04;letter-spacing:-.045em;margin:0;max-width:820px}.lead{font-size:18px;color:var(--muted);max-width:720px;margin:22px 0 0}.nav{position:fixed;inset:0 0 auto;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid transparent}.nav.scrolled{border-color:var(--line)}.nav-inner{height:76px;display:flex;align-items:center;gap:28px}.brand{font-family:var(--display);font-weight:800;letter-spacing:-.02em}.brand small{display:block;font-family:var(--font);font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:-3px}.links{display:flex;gap:24px;margin-left:auto;font-size:14px;font-weight:600;color:var(--muted)}.links a:hover{color:var(--text)}.nav-actions{display:flex;gap:8px;align-items:center}.edit-badge{font-size:12px;font-weight:700;color:var(--brand);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:50%;display:grid;place-items:center;color:var(--text);cursor:pointer}.menu-btn{display:none}.mobile{display:none;padding:8px 28px 20px;background:var(--bg);border-bottom:1px solid var(--line)}.mobile.open{display:block}.mobile a{display:block;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
.hero{min-height:100vh;padding:140px 0 80px;display:flex;align-items:center;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(199,55,99,.14),transparent 68%);right:-180px;top:80px}.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:70px;align-items:center}.hero h1{font-family:var(--display);font-size:clamp(58px,8vw,108px);line-height:.92;letter-spacing:-.065em;margin:0}.hero h1 span{display:block;color:var(--brand)}.hero-sub{font-size:22px;color:var(--muted);max-width:720px;margin:28px 0 0}.hero-copy{font-size:17px;color:var(--muted);max-width:680px;margin:20px 0 0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.08)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.portrait{position:relative}.portrait-card{background:var(--surface);border-radius:34px;padding:14px;box-shadow:var(--shadow);transform:rotate(1.5deg)}.portrait-card img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:25px;background:var(--surface-2)}.portrait-meta{display:flex;justify-content:space-between;padding:18px 8px 6px;font-size:13px;color:var(--muted)}.portrait-meta strong{color:var(--text)}.photo-edit{display:none;position:absolute;inset:14px 14px 62px;background:rgba(10,15,25,.55);border-radius:25px;place-items:center}.editing .photo-edit{display:grid}.impact-strip{margin-top:72px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.impact-item{padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}.impact-item strong{display:block;font-family:var(--display);font-size:20px;line-height:1.25}.impact-item span{display:block;color:var(--muted);font-size:14px;margin-top:12px}
.profile{display:grid;grid-template-columns:.85fr 1.15fr;gap:90px}.profile aside{position:sticky;top:120px;align-self:start}.profile-copy p{font-size:21px;line-height:1.65;margin:0 0 24px;color:var(--muted)}.profile-copy p:first-child{color:var(--text)}.signature{margin-top:36px;padding-top:28px;border-top:1px solid var(--line);display:flex;gap:30px;flex-wrap:wrap}.signature div{min-width:180px}.signature b{display:block}.signature span{color:var(--muted);font-size:14px}
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px}.cap{background:var(--surface);padding:30px;border-radius:var(--radius);border:1px solid var(--line)}.cap-no{display:none!important}.cap h3{font-family:var(--display);font-size:22px;line-height:1.2;margin:0 0 12px}.cap p{color:var(--muted);margin:0}
.engagements{background:var(--dark);color:var(--bg)}html[data-theme="dark"] .engagements{background:#090c12;color:#f7f8fb}.engagements .lead{color:rgba(255,255,255,.65)}.case-list{margin-top:54px;border-top:1px solid rgba(255,255,255,.16)}.case{display:grid;grid-template-columns:160px 1fr 28px;gap:30px;padding:34px 0;border-bottom:1px solid rgba(255,255,255,.16);cursor:pointer}.case .sector{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:#d7a1b4}.case h3{font-family:var(--display);font-size:clamp(25px,3vw,38px);line-height:1.15;margin:0}.case p{color:rgba(255,255,255,.65);margin:10px 0 0;max-width:760px}.arrow{font-size:28px}.journey{display:grid;grid-template-columns:.85fr 1.15fr;gap:90px}.timeline{border-left:1px solid var(--line);padding-left:34px}.job{position:relative;padding:0 0 40px}.job:before{content:"";position:absolute;left:-40px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 6px var(--bg)}.job .year{color:var(--brand);font-weight:700;font-size:13px}.job h3{font-family:var(--display);font-size:24px;margin:8px 0 2px}.job .org{color:var(--muted);font-weight:600}.job p{color:var(--muted);margin:12px 0 0;max-width:700px}.philosophy{background:var(--surface)}.quote{font-family:var(--display);font-size:clamp(36px,5vw,68px);line-height:1.14;letter-spacing:-.045em;max-width:1050px}.quote span{color:var(--brand)}.philosophy-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:50px;color:var(--muted);font-size:18px}.contact-card{background:linear-gradient(145deg,var(--brand-2),var(--brand));color:white;border-radius:30px;padding:48px}.contact-card p{color:rgba(255,255,255,.78);font-size:18px;max-width:760px;margin:18px 0 0}.contact-card .btn{background:white;color:#2b1730;border:0}.contact-wide{display:flex;align-items:flex-end;justify-content:space-between;gap:48px}.contact-wide h2{font-family:var(--display);font-size:clamp(38px,5vw,64px);line-height:1.05;letter-spacing:-.045em;margin:0;max-width:820px}.contact-wide .actions{margin-top:0;flex-shrink:0}.contact-content{max-width:830px}.footer{padding:28px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px}.modal.open{display:flex}.modal-bg{position:absolute;inset:0;background:rgba(5,10,18,.72);backdrop-filter:blur(8px)}.modal-card{position:relative;background:var(--surface);color:var(--text);width:min(860px,100%);max-height:86vh;overflow:auto;border-radius:28px;padding:38px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:20px}.modal h3{font-family:var(--display);font-size:36px;line-height:1.1;margin:8px 0 0}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}.case-details{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}.case-details div{padding-top:18px;border-top:1px solid var(--line)}.case-details h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);margin:0 0 10px}.case-details p{color:var(--muted);margin:0}.editbar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,0);z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px;display:flex;gap:7px;box-shadow:var(--shadow);flex-wrap:wrap;max-width:calc(100% - 24px);justify-content:center}.editbar button{border:0;border-radius:999px;padding:10px 15px;background:var(--surface-2);font-weight:700;cursor:pointer}.editbar .save,.editbar .publish{background:var(--text);color:var(--bg)}.editbar .publish{background:var(--brand)}[contenteditable=true]{outline:1px dashed color-mix(in srgb,var(--brand) 70%,transparent);outline-offset:4px;border-radius:5px;cursor:text;min-width:1ch}[contenteditable=true]:focus{outline:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 6%,transparent)}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;z-index:130;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.reveal{opacity:1;transform:none}
@media(max-width:920px){.links{display:none}.menu-btn{display:grid}.hero-grid,.profile,.journey{grid-template-columns:1fr}.contact-wide{flex-direction:column;align-items:flex-start}.portrait{max-width:430px}.profile aside{position:static}.impact-strip{grid-template-columns:1fr 1fr}.cap-grid{grid-template-columns:1fr 1fr}.case{grid-template-columns:110px 1fr 20px}.philosophy-grid{grid-template-columns:1fr}}
@media(max-width:620px){.wrap{padding:0 20px}.section{padding:80px 0}.hero{padding-top:120px}.impact-strip,.cap-grid{grid-template-columns:1fr}.contact-card{padding:30px}.case{grid-template-columns:1fr 22px}.case .sector{grid-column:1/-1}.case-details{grid-template-columns:1fr}.modal-card{padding:26px}.editbar{border-radius:22px}}
</style>
</head>
<body class="editing">
<header class="nav" id="nav"><div class="wrap nav-inner"><a class="brand" href="../"><span data-edit="identity.name">Muhammad Shamel</span><small data-edit="identity.title">Enterprise Infrastructure Architect</small></a><nav class="links"><a href="#profile">Profile</a><a href="#capabilities">Capabilities</a><a href="#engagements">Engagements</a><a href="#journey">Journey</a><a href="#contact">Contact</a></nav><div class="nav-actions"><span class="edit-badge">Edit mode</span><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button><button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button></div></div><nav class="mobile" id="mobile"><a href="#profile">Profile</a><a href="#capabilities">Capabilities</a><a href="#engagements">Engagements</a><a href="#journey">Journey</a><a href="#contact">Contact</a></nav></header>
<main id="top">
<section class="hero"><div class="wrap"><div class="hero-grid"><div><div class="eyebrow" data-edit="hero.eyebrow"></div><h1 data-edit="hero.headline"></h1><p class="hero-sub" data-edit="hero.sub"></p><p class="hero-copy" data-edit="hero.copy"></p><div class="actions"><a class="btn primary" href="#engagements" data-edit="labels.viewEngagements">View selected engagements</a><a class="btn" id="linkedinBtn" href="#">LinkedIn</a><a class="btn" id="cvBtn" href="#">Download CV</a></div></div><div class="portrait"><div class="portrait-card"><img id="photo" alt="Muhammad Shamel"><div class="photo-edit"><button class="btn" id="photoButton">Change photo</button><input id="photoInput" type="file" accept="image/*" hidden></div><div class="portrait-meta"><strong data-edit="identity.role"></strong><span data-edit="identity.company"></span></div></div></div></div><div class="impact-strip" id="impactStrip"></div></div></section>
<section class="section" id="profile"><div class="wrap profile"><aside><div class="eyebrow" data-edit="sections.profileEyebrow"></div><h2 data-edit="sections.profileHeading"></h2></aside><div class="profile-copy"><p data-edit="profile.p1"></p><p data-edit="profile.p2"></p><p data-edit="profile.p3"></p><div class="signature"><div><b>Current role</b><span data-edit="identity.role"></span></div><div><b>Primary focus</b><span data-edit="identity.focus"></span></div><div><b>Platforms</b><span data-edit="identity.platforms"></span></div></div></div></div></section>
<section class="section" id="capabilities"><div class="wrap"><div class="eyebrow" data-edit="sections.capabilitiesEyebrow"></div><h2 data-edit="sections.capabilitiesHeading"></h2><p class="lead" data-edit="sections.capabilitiesLead"></p><div class="cap-grid" id="capGrid"></div></div></section>
<section class="section engagements" id="engagements"><div class="wrap"><div class="eyebrow" data-edit="sections.engagementsEyebrow"></div><h2 data-edit="sections.engagementsHeading"></h2><p class="lead" data-edit="sections.engagementsLead"></p><div class="case-list" id="caseList"></div></div></section>
<section class="section" id="journey"><div class="wrap journey"><div><div class="eyebrow" data-edit="sections.journeyEyebrow"></div><h2 data-edit="sections.journeyHeading"></h2><p class="lead" data-edit="sections.journeyLead"></p></div><div class="timeline" id="timeline"></div></div></section>
<section class="section philosophy"><div class="wrap"><div class="eyebrow" data-edit="sections.philosophyEyebrow"></div><div class="quote" data-edit="philosophy.quote"></div><div class="philosophy-grid"><p data-edit="philosophy.p1"></p><p data-edit="philosophy.p2"></p></div></div></section>
<section class="section" id="contact"><div class="wrap"><div class="contact-card contact-wide"><div class="contact-content"><div class="eyebrow" style="color:#ffd4e0" data-edit="sections.contactEyebrow">Contact</div><h2 data-edit="contact.heading"></h2><p data-edit="contact.copy"></p></div><div class="actions"><a class="btn" id="emailBtn" href="#">Send an email</a><a class="btn" id="contactLinkedin" href="#">Connect on LinkedIn</a></div></div></div></section>
</main>
<footer class="footer"><div class="wrap footer-inner"><span data-edit="footer.left"></span><span data-edit="footer.right"></span></div></footer>
<div class="modal" id="modal"><div class="modal-bg" data-close></div><article class="modal-card"><div class="modal-head"><div><div class="eyebrow" id="modalSector"></div><h3 id="modalTitle"></h3></div><button class="close" data-close>×</button></div><p class="lead" id="modalIntro"></p><div class="case-details" id="modalDetails"></div></article></div>
<div class="editbar show" id="editbar">
  <button id="editLinks">Links</button>
  <button id="uploadCv">Upload CV</button>
  <button id="removeCv">Remove CV</button>
  <input id="cvInput" type="file" accept="application/pdf,.pdf" hidden>
  <button id="save">Save draft</button>
  <button class="publish" id="publish">Publish live</button>
  <button id="reset">Reset</button>
  <button id="done">View site</button>
</div>
<div class="toast" id="toast"></div>
<script>window.SITE_CONFIG={mode:"edit",contentPath:"../data/content.json",assetPrefix:"../"};</script>
<script src="../js/site.js"></script>
</body>
